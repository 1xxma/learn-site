<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEARN - Войти</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">LEARN</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="subjects.html">Предметы</a>
            <a href="reviews.html">Отзывы</a>
            <a href="about.html">О нас</a>
            <a href="login.html">Войти</a>
            <div class="profile-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </nav>
    </header>

    <div class="subjects-header">
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Войти
        </a>
    </div>

    <main class="login-container">
        <div class="login-card">
            <h1>Вход в аккаунт</h1>
            <p class="login-subtitle">Введите свой логин и пароль, чтобы продолжить обучение</p>

            <form class="login-form" id="loginForm" novalidate>

                <!-- Логин -->
                <div class="form-group">
                    <label for="login">Логин</label>
                    <input 
                        type="text" 
                        id="login" 
                        class="form-input" 
                        placeholder="Введите логин или email"
                        autocomplete="username"
                    >
                    <div class="form-error" id="error-login"></div>
                </div>

                <!-- Пароль -->
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Введите пароль"
                            autocomplete="current-password"
                        >
                        <button 
                            type="button" 
                            class="toggle-password" 
                            onclick="togglePassword()" 
                            aria-label="Показать пароль"
                        >
                            <svg id="eye-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="form-error" id="error-password"></div>
                </div>

                <button type="submit" class="login-submit-btn">Войти</button>

            </form>

            <div class="login-footer">
                <span>Ещё нет аккаунта?</span>
                <a href="register.html" class="login-link">Зарегистрироваться</a>
            </div>
        </div>
    </main>

    <script>
        /* ============================================
           ПОКАЗАТЬ/СКРЫТЬ ПАРОЛЬ
           ============================================ */
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        /* ============================================
           ВАЛИДАЦИЯ И ВХОД
           ============================================ */
        const form = document.getElementById('loginForm');
        const loginInput = document.getElementById('login');
        const passwordInput = document.getElementById('password');

        const errors = {
            login: document.getElementById('error-login'),
            password: document.getElementById('error-password')
        };

        function showError(field, message) {
            errors[field].textContent = message;
            errors[field].classList.add('visible');
        }

        function clearError(field) {
            errors[field].textContent = '';
            errors[field].classList.remove('visible');
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            clearError('login');
            clearError('password');

            let isValid = true;

            const loginValue = loginInput.value.trim();
            const passwordValue = passwordInput.value;

            if (loginValue === '') {
                showError('login', 'Введите логин или email');
                isValid = false;
            }

            if (passwordValue === '') {
                showError('password', 'Введите пароль');
                isValid = false;
            } else if (passwordValue.length < 6) {
                showError('password', 'Пароль должен быть минимум 6 символов');
                isValid = false;
            }

            if (!isValid) return;

            // Проверяем, есть ли сохранённый пользователь
            const savedName = localStorage.getItem('userName');
            const savedEmail = localStorage.getItem('userEmail');

            if (savedName || savedEmail) {
                // Вход разрешён
                localStorage.setItem('isLoggedIn', 'true');
                if (!localStorage.getItem('userName')) {
                    localStorage.setItem('userName', loginValue);
                }
                alert(`Добро пожаловать, ${localStorage.getItem('userName')}! 🎉`);
                window.location.href = 'index.html';
            } else {
                // Аккаунта нет — предлагаем зарегистрироваться
                alert('Аккаунт не найден. Пожалуйста, зарегистрируйтесь.');
                window.location.href = 'register.html';
            }
        });

        // Убираем ошибки при вводе
        loginInput.addEventListener('input', () => clearError('login'));
        passwordInput.addEventListener('input', () => clearError('password'));
    </script>

    <!-- СКРИПТ ДЛЯ ОТОБРАЖЕНИЯ ЛОГИНА В ШАПКЕ -->
    <script>
        (function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const userName = localStorage.getItem('userName');

            if (isLoggedIn && userName) {
                const navLinks = document.querySelectorAll('nav a');
                let loginLink = null;
                
                navLinks.forEach(link => {
                    if (link.textContent.trim() === 'Войти' || link.href.includes('login.html')) {
                        loginLink = link;
                    }
                });

                if (loginLink) {
                    loginLink.textContent = userName;
                    loginLink.href = '#';
                    loginLink.classList.add('user-name-link');
                    loginLink.title = 'Нажмите, чтобы выйти';

                    loginLink.addEventListener('click', function(e) {
                        e.preventDefault();
                        if (confirm('Выйти из аккаунта?')) {
                            localStorage.removeItem('isLoggedIn');
                            localStorage.removeItem('userName');
                            localStorage.removeItem('userEmail');
                            localStorage.removeItem('userBookings');
                            window.location.href = 'index.html';
                        }
                    });
                }
            }
        })();
    </script>
<script>
    // ============================================
    // ОТОБРАЖЕНИЕ ЛОГИНА В ШАПКЕ
    // ============================================
    (function() {
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const userName = localStorage.getItem('userName');

        if (isLoggedIn && userName) {
            // Находим ссылку "Войти" в шапке
            const navLinks = document.querySelectorAll('nav a');
            let loginLink = null;
            
            navLinks.forEach(link => {
                if (link.textContent.trim() === 'Войти' || link.href.includes('login.html')) {
                    loginLink = link;
                }
            });

            if (loginLink) {
                // Заменяем на имя пользователя
                loginLink.textContent = userName;
                loginLink.href = '#';
                loginLink.classList.add('user-name-link');
                loginLink.title = 'Нажмите, чтобы выйти';

                // Клик по имени — выход
                loginLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (confirm('Выйти из аккаунта?')) {
                        localStorage.removeItem('isLoggedIn');
                        localStorage.removeItem('userName');
                        localStorage.removeItem('userEmail');
                        localStorage.removeItem('userBookings');
                        window.location.href = 'index.html';
                    }
                });
            }
        }
    })();
</script>
</body>
</html>
