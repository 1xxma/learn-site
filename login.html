<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEARN - Войти</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>

    <header>
        <div class="logo">LEARN</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="subjects.html">Предметы</a>
            <a href="reviews.html">Отзывы</a>
            <a href="about.html">О нас</a>
            <a href="login.html">Войти</a>
            <div class="profile-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </nav>
    </header>

    <div class="subjects-header">
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Войти
        </a>
    </div>

    <main class="login-container">
        <div class="login-card">
            <h1>Вход в аккаунт</h1>
            <p class="login-subtitle">Введите свой email и пароль, чтобы продолжить обучение</p>

            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="example@mail.ru" autocomplete="username">
                    <div class="form-error" id="error-email"></div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Введите пароль" autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Показать пароль">
                            <svg id="eye-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="form-error" id="error-password"></div>
                </div>

                <button type="submit" class="login-submit-btn" id="loginBtn">Войти</button>
            </form>

            <div class="login-footer">
                <span>Ещё нет аккаунта?</span>
                <a href="register.html" class="login-link">Зарегистрироваться</a>
            </div>
        </div>
    </main>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            }
        }

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        const errors = {
            email: document.getElementById('error-email'),
            password: document.getElementById('error-password')
        };

        function showError(field, message) {
            errors[field].textContent = message;
            errors[field].classList.add('visible');
        }
        function clearError(field) {
            errors[field].textContent = '';
            errors[field].classList.remove('visible');
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            clearError('email');
            clearError('password');

            const emailValue = emailInput.value.trim();
            const passwordValue = passwordInput.value;

            let isValid = true;
            if (emailValue === '') { showError('email', 'Введите email'); isValid = false; }
            if (passwordValue === '') { showError('password', 'Введите пароль'); isValid = false; }
            else if (passwordValue.length < 6) { showError('password', 'Минимум 6 символов'); isValid = false; }
            if (!isValid) return;

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Проверяем...';

            const result = await login(emailValue, passwordValue);

            if (!result.ok) {
                showError('password', result.error);
                btn.disabled = false;
                btn.textContent = 'Войти';
                return;
            }

            window.location.href = 'index.html';
        });

        emailInput.addEventListener('input', () => clearError('email'));
        passwordInput.addEventListener('input', () => clearError('password'));
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const user = getCurrentUser();
            if (!user) return;

            document.querySelectorAll('nav a').forEach(link => {
                const text = link.textContent.trim();
                if (text === 'Войти' || link.getAttribute('href') === 'login.html') {
                    link.textContent = user.name;
                    link.setAttribute('href', '#');
                    link.classList.add('user-name-link');
                    link.title = 'Нажмите, чтобы выйти';
                    link.addEventListener('click', function (e) {
                        e.preventDefault();
                        if (confirm('Выйти из аккаунта?')) logout();
                    });
                }
            });
        });
    </script>

</body>
</html>
