<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEARN - Предметы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">LEARN</div>
        <nav>
            <a href="#">Войти</a>
            <div class="profile-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </nav>
    </header>

    <div class="subjects-header">
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Предметы
        </a>
    </div>

    <main class="subjects-container">
        <div class="subjects-panel">
            <h2>Выберите предмет</h2>
            <div class="subjects-grid">
                <button class="subject-btn">Математика</button>
                <button class="subject-btn">Английский язык</button>
                <button class="subject-btn">Русский язык</button>
                <button class="subject-btn">История</button>
                <button class="subject-btn">Биология</button>
                <button class="subject-btn">Обществознание</button>
                <button class="subject-btn">География</button>
                <button class="subject-btn">Литература</button>
            </div>
        </div>
        
        <div class="level-panel">
            <h2>Выберите уровень</h2>
            <div class="level-list">
                <button class="level-btn">1-4 классы</button>
                <button class="level-btn">5-7 классы</button>
                <button class="level-btn">8-11 классы</button>
            </div>
        </div>
    </main>

</body>
</html>
