<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEARN - Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">LEARN</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="subjects.html">Предметы</a>
            <a href="reviews.html">Отзывы</a>
            <a href="about.html">О нас</a>
            <a href="login.html">Войти</a>
            <div class="profile-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </nav>
    </header>

    <div class="subjects-header">
        <a href="login.html" class="back-btn">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Регистрация
        </a>
    </div>

    <main class="login-container">
        <div class="login-card">
            <h1>Создать аккаунт</h1>
            <p class="login-subtitle">Заполните форму, чтобы начать заниматься с репетитором</p>

            <form class="login-form" id="registerForm" novalidate>

                <!-- Имя -->
                <div class="form-group">
                    <label for="name">Имя</label>
                    <input 
                        type="text" 
                        id="name" 
                        class="form-input" 
                        placeholder="Как к вам обращаться?"
                        autocomplete="name"
                    >
                    <div class="form-error" id="error-name"></div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="example@mail.ru"
                        autocomplete="email"
                    >
                    <div class="form-error" id="error-email"></div>
                </div>

                <!-- Пароль -->
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Минимум 6 символов"
                            autocomplete="new-password"
                        >
                        <button 
                            type="button" 
                            class="toggle-password" 
                            onclick="togglePassword('password', 'eye-icon-1')" 
                            aria-label="Показать пароль"
                        >
                            <svg id="eye-icon-1" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="form-error" id="error-password"></div>
                </div>

                <!-- Повтор пароля -->
                <div class="form-group">
                    <label for="password-confirm">Повторите пароль</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password-confirm" 
                            class="form-input" 
                            placeholder="Введите пароль ещё раз"
                            autocomplete="new-password"
                        >
                        <button 
                            type="button" 
                            class="toggle-password" 
                            onclick="togglePassword('password-confirm', 'eye-icon-2')" 
                            aria-label="Показать пароль"
                        >
                            <svg id="eye-icon-2" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="form-error" id="error-password-confirm"></div>
                </div>

                <!-- Чекбокс согласия -->
                <div class="form-group form-checkbox">
                    <label for="agree" class="checkbox-label">
                        <input type="checkbox" id="agree">
                        <span>Я согласен с условиями использования и политикой конфиденциальности</span>
                    </label>
                    <div class="form-error" id="error-agree"></div>
                </div>

                <button type="submit" class="login-submit-btn">Зарегистрироваться</button>

            </form>

            <div class="login-footer">
                <span>Уже есть аккаунт?</span>
                <a href="login.html" class="login-link">Войти</a>
            </div>
        </div>
    </main>

    <script>
        /* ============================================
           ПОКАЗАТЬ/СКРЫТЬ ПАРОЛЬ
           ============================================ */
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        /* ============================================
           ВАЛИДАЦИЯ ФОРМЫ
           ============================================ */
        const form = document.getElementById('registerForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('password-confirm');
        const agreeInput = document.getElementById('agree');

        const errors = {
            name: document.getElementById('error-name'),
            email: document.getElementById('error-email'),
            password: document.getElementById('error-password'),
            passwordConfirm: document.getElementById('error-password-confirm'),
            agree: document.getElementById('error-agree')
        };

        function showError(field, message) {
            errors[field].textContent = message;
            errors[field].classList.add('visible');
        }

        function clearError(field) {
            errors[field].textContent = '';
            errors[field].classList.remove('visible');
        }

        function clearAllErrors() {
            Object.keys(errors).forEach(field => clearError(field));
        }

        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            clearAllErrors();

            let isValid = true;

            // Имя
            const nameValue = nameInput.value.trim();
            if (nameValue === '') {
                showError('name', 'Введите имя');
                isValid = false;
            } else if (nameValue.length < 2) {
                showError('name', 'Имя должно содержать минимум 2 символа');
                isValid = false;
            }

            // Email
            const emailValue = emailInput.value.trim();
            if (emailValue === '') {
                showError('email', 'Введите email');
                isValid = false;
            } else if (!isValidEmail(emailValue)) {
                showError('email', 'Введите корректный email (пример: name@mail.ru)');
                isValid = false;
            }

            // Пароль
            const passwordValue = passwordInput.value;
            if (passwordValue === '') {
                showError('password', 'Введите пароль');
                isValid = false;
            } else if (passwordValue.length < 6) {
                showError('password', 'Пароль должен содержать минимум 6 символов');
                isValid = false;
            } else if (!/[A-Za-z]/.test(passwordValue) || !/[0-9]/.test(passwordValue)) {
                showError('password', 'Пароль должен содержать буквы и цифры');
                isValid = false;
            }

            // Повтор пароля
            const confirmValue = passwordConfirmInput.value;
            if (confirmValue === '') {
                showError('passwordConfirm', 'Повторите пароль');
                isValid = false;
            } else if (confirmValue !== passwordValue) {
                showError('passwordConfirm', 'Пароли не совпадают');
                isValid = false;
            }

            // Чекбокс
            if (!agreeInput.checked) {
                showError('agree', 'Необходимо согласие с условиями');
                isValid = false;
            }

            // УСПЕХ
            if (isValid) {
                // Сохраняем данные пользователя
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userName', nameValue);
                localStorage.setItem('userEmail', emailValue);

                alert(`Регистрация прошла успешно! Добро пожаловать в LEARN, ${nameValue} 🎉`);
                window.location.href = 'index.html';
            }
        });

        // Убираем ошибки при вводе
        nameInput.addEventListener('input', () => clearError('name'));
        emailInput.addEventListener('input', () => clearError('email'));
        passwordInput.addEventListener('input', () => clearError('password'));
        passwordConfirmInput.addEventListener('input', () => clearError('passwordConfirm'));
        agreeInput.addEventListener('change', () => clearError('agree'));
    </script>

    <!-- СКРИПТ ДЛЯ ОТОБРАЖЕНИЯ ЛОГИНА В ШАПКЕ -->
    <script>
        (function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const userName = localStorage.getItem('userName');

            if (isLoggedIn && userName) {
                const navLinks = document.querySelectorAll('nav a');
                let loginLink = null;
                
                navLinks.forEach(link => {
                    if (link.textContent.trim() === 'Войти' || link.href.includes('login.html')) {
                        loginLink = link;
                    }
                });

                if (loginLink) {
                    loginLink.textContent = userName;
                    loginLink.href = '#';
                    loginLink.classList.add('user-name-link');
                    loginLink.title = 'Нажмите, чтобы выйти';

                    loginLink.addEventListener('click', function(e) {
                        e.preventDefault();
                        if (confirm('Выйти из аккаунта?')) {
                            localStorage.removeItem('isLoggedIn');
                            localStorage.removeItem('userName');
                            localStorage.removeItem('userEmail');
                            localStorage.removeItem('userBookings');
                            window.location.href = 'index.html';
                        }
                    });
                }
            }
        })();
    </script>
<script>
    // ============================================
    // ОТОБРАЖЕНИЕ ЛОГИНА В ШАПКЕ
    // ============================================
    (function() {
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const userName = localStorage.getItem('userName');

        if (isLoggedIn && userName) {
            // Находим ссылку "Войти" в шапке
            const navLinks = document.querySelectorAll('nav a');
            let loginLink = null;
            
            navLinks.forEach(link => {
                if (link.textContent.trim() === 'Войти' || link.href.includes('login.html')) {
                    loginLink = link;
                }
            });

            if (loginLink) {
                // Заменяем на имя пользователя
                loginLink.textContent = userName;
                loginLink.href = '#';
                loginLink.classList.add('user-name-link');
                loginLink.title = 'Нажмите, чтобы выйти';

                // Клик по имени — выход
                loginLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (confirm('Выйти из аккаунта?')) {
                        localStorage.removeItem('isLoggedIn');
                        localStorage.removeItem('userName');
                        localStorage.removeItem('userEmail');
                        localStorage.removeItem('userBookings');
                        window.location.href = 'index.html';
                    }
                });
            }
        }
    })();
</script>
</body>
</html>
