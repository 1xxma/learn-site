    <script src="auth.js"></script>
    <script>
        function toggleDropdown(btn) {
            document.querySelectorAll('.subject-btn').forEach(b => {
                if (b !== btn) {
                    b.classList.remove('active');
                    const menu = b.parentElement.querySelector('.dropdown-menu');
                    if (menu) menu.classList.remove('show');
                }
            });

            btn.classList.toggle('active');
            const menu = btn.parentElement.querySelector('.dropdown-menu');
            if (menu) menu.classList.toggle('show');
        }

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.subject-item')) {
                document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            const user = getCurrentUser();
            if (!user) return;

            document.querySelectorAll('nav a').forEach(link => {
                const text = link.textContent.trim();
                if (text === 'Войти' || link.getAttribute('href') === 'login.html') {
                    link.textContent = user.name;
                    link.setAttribute('href', '#');
                    link.classList.add('user-name-link');
                    link.title = 'Нажмите, чтобы выйти';
                    link.setAttribute('role', 'button');
                    link.addEventListener('click', function (e) {
                        e.preventDefault();
                        if (confirm('Выйти из аккаунта?')) logout();
                    });
                }
            });
        });
    </script>
