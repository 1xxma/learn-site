<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEARN - Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">LEARN</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="subjects.html">Предметы</a>
            <a href="reviews.html">Отзывы</a>
            <a href="about.html">О нас</a>
            <a href="login.html">Войти</a>
            <div class="profile-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h1>Регистрация</h1>
            <p class="login-subtitle">Создайте аккаунт, чтобы записываться к репетиторам</p>

            <form class="login-form" id="registerForm" novalidate>
                <div class="form-group">
                    <label for="regName">Имя</label>
                    <input type="text" id="regName" class="form-input" placeholder="Как вас зовут?" required>
                    <div class="form-error" id="regNameError"></div>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" class="form-input" placeholder="example@mail.ru" required>
                    <div class="form-error" id="regEmailError"></div>
                </div>

                <div class="form-group">
                    <label for="regPassword">Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" class="form-input" placeholder="Минимум 6 символов" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="form-error" id="regPasswordError"></div>
                </div>

                <div class="form-group">
                    <label for="regPassword2">Повторите пароль</label>
                    <input type="password" id="regPassword2" class="form-input" placeholder="Ещё раз" required>
                    <div class="form-error" id="regPassword2Error"></div>
                </div>

                <button type="submit" class="login-submit-btn" id="registerBtn">Зарегистрироваться</button>

                <div class="login-footer">
                    Уже есть аккаунт? <a href="login.html" class="login-link">Войти</a>
                </div>
            </form>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        // Показать/скрыть пароль
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showError(fieldId, msg) {
            const err = document.getElementById(fieldId + 'Error');
            err.textContent = msg;
            err.classList.add('visible');
            document.getElementById(fieldId).classList.add('input-error');
        }

        function clearErrors() {
            document.querySelectorAll('.form-error').forEach(e => {
                e.textContent = '';
                e.classList.remove('visible');
            });
            document.querySelectorAll('.form-input').forEach(i => {
                i.classList.remove('input-error');
            });
        }

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            clearErrors();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;
            const pass2 = document.getElementById('regPassword2').value;

            let hasError = false;

            if (!name) { showError('regName', 'Введите имя'); hasError = true; }
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('regEmail', 'Введите корректный email'); hasError = true;
            }
            if (pass.length < 6) { showError('regPassword', 'Минимум 6 символов'); hasError = true; }
            if (pass !== pass2) { showError('regPassword2', 'Пароли не совпадают'); hasError = true; }

            if (hasError) return;

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = 'Создаём аккаунт...';

            const result = await register(name, email, pass);

            if (!result.ok) {
                showError('regEmail', result.error);
                btn.disabled = false;
                btn.textContent = 'Зарегистрироваться';
                return;
            }

            // Успех — редирект на главную
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
